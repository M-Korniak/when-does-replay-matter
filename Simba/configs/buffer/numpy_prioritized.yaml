buffer_class_type: 'numpy'   # [numpy, jax (distributed-friendly)]
buffer_type: 'prioritized'   # [uniform, exponential, ere, prioritized]

n_step: ${n_step}
gamma: ${gamma}
max_length: 1_000_000        # maximum buffer size.
min_length: 5_000            # minimum buffer size (= number of data to collect before training).
sample_batch_size: 256       # larger batch recommended for PER stability.

alpha_sampling: 0.6          # priority exponent: how much prioritization to use (0 = uniform)
beta_start: 0.4              # IS weight start value, annealed to 1.0 over max_steps
max_steps: 1_000_000         # steps over which beta is annealed to 1.0
